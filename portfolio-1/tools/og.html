<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Social card</title>
<!-- Source for img/og.png, the image shown when the site is shared. Open at 1200x630 and capture. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Doto:wght@400..900&display=swap">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/device.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: grid; place-items: center; background: var(--page); }
  .card {
    position: relative;
    display: grid;
    gap: 34px;
    width: 1110px;
    padding: 52px 56px 50px;
    border-radius: 24px;
    background: var(--panel);
    box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--edge), 0 40px 70px -40px rgb(var(--shadow-rgb) / .6);
  }
  .card__top { display: flex; justify-content: space-between; align-items: end; gap: 40px; }
  .card .wordmark { width: auto; font-size: 168px; }
  .card__who { display: grid; gap: 10px; padding-bottom: 6px; text-align: right; }
  .card__name { font-size: 34px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.01em; }
  .card__role { font-size: 22px; color: var(--ink-soft); }
  .card__keys { display: grid; grid-template-columns: repeat(16, 1fr); gap: 8px; }
  .card__keys i {
    height: 58px; border-radius: 6px; background: var(--key);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .45), 0 3px 0 var(--key-side);
  }
  .card__keys i:nth-child(n+5):nth-child(-n+8), .card__keys i:nth-child(n+13) { background: var(--key-alt); }
  .card__keys .o { background: var(--orange) !important; }
  .card__keys .b { background: var(--blue) !important; }
  .card__keys .g { background: var(--green) !important; }
  .card__keys .y { background: var(--yellow) !important; }
  .card__foot { display: flex; justify-content: space-between; color: var(--ink-soft); font-size: 20px; }
</style>
</head>
<body>
  <div class="card">
    <span class="screw screw--tl"></span><span class="screw screw--tr"></span>
    <span class="screw screw--bl"></span><span class="screw screw--br"></span>
    <div class="card__top">
      <div class="wordmark">haven</div>
      <div class="card__who">
        <div class="card__name">Haven Leno J</div>
        <div class="card__role">full-stack developer, Chennai</div>
      </div>
    </div>
    <div class="card__keys">
      <i class="o"></i><i></i><i class="g"></i><i class="y"></i>
      <i class="o b"></i><i></i><i class="g"></i><i></i>
      <i class="o"></i><i class="y"></i><i class="g"></i><i></i>
      <i class="b"></i><i class="y"></i><i class="g"></i><i></i>
    </div>
    <div class="card__foot"><span>a portfolio you can play</span><span>React, Node.js, Express, Spring Boot</span></div>
  </div>
</body>
</html>
